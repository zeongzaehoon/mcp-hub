# Stand-in for ~/dev/aws-local on CI runners: DynamoDB Local + MinIO on the external `aws-local` network
# with the same aliases/ports the stack and the host-side tests expect. Dummy credentials only.
name: aws-local-ci
services:
  dynamodb:
    image: amazon/dynamodb-local:2.5.3
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports: ["127.0.0.1:8000:8000"]
    networks:
      aws-local:
        aliases: [dynamodb]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports: ["127.0.0.1:9000:9000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      aws-local:
        aliases: [minio]
networks:
  aws-local:
    external: true
