[project]
name = "mcp-cluster-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "aioboto3>=13.1",
  "redis[hiredis]>=5.0",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "orjson>=3.10",
  "pyarrow>=25.0.1",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning", "ignore::jwt.warnings.InsecureKeyLengthWarning"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
