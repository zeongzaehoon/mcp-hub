# Throwaway e2e stack, layered on docker-compose.yml (same directory) by scripts/e2e.sh (project mcp-cluster-e2e). Fully self-contained:
# its own Redis / Postgres / ClickHouse / Mongo and an in-memory DynamoDB Local + MinIO on its own networks, so
# `down -v` leaves nothing behind. It must not join the shared external `aws-local` network: service names such as
# `mcp-postgres` would then resolve to the dev stack's containers too (a different Redis => "unknown api key").
# Host ports are the dev ones + 10000 so it runs alongside a running dev stack: only the nginx `gateway` (29000) and the
# stores the host-side tests need (MinIO, pg-sample) are published.

x-e2e-s3: &e2e-s3
  S3_PUBLIC_ENDPOINT: http://localhost:29090
  S3_ACCESS_KEY: e2e-minio
  S3_SECRET_KEY: e2e-minio-secret

services:
  dynamodb:
    image: amazon/dynamodb-local:2.5.3
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    networks:
      aws-local:
        aliases: [dynamodb]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: e2e-minio
      MINIO_ROOT_PASSWORD: e2e-minio-secret
    # host-side tests download presigned export links
    ports: ["127.0.0.1:29090:9000"]
    networks:
      aws-local:
        aliases: [minio]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    ports: !reset []

  backend:
    environment:
      <<: *e2e-s3  # access logs also go to the S3 audit lake
      CONSOLE_URL: http://localhost:29000
      GATEWAY_PUBLIC_URL: http://localhost:29000
    depends_on:
      dynamodb: { condition: service_healthy }
      minio: { condition: service_healthy }

  # the Playwright page reroutes VITE_API_BASE calls to backend:8080 in-network, so the bundle's URL may stay as is

  pg-sample:
    ports: !override ["127.0.0.1:65432:5432"]

  clickhouse:
    ports: !reset []

  mongo:
    ports: !reset []

  mcp-postgres:
    environment: *e2e-s3
    depends_on:
      minio: { condition: service_healthy }

  mcp-clickhouse:
    environment: *e2e-s3
    depends_on:
      minio: { condition: service_healthy }

  mcp-mongo:
    environment: *e2e-s3
    depends_on:
      minio: { condition: service_healthy }

  mcp-hacker:
    environment: *e2e-s3
    depends_on:
      minio: { condition: service_healthy }

  mcp-gateway:
    environment:
      <<: *e2e-s3
      GATEWAY_PUBLIC_URL: http://localhost:29000
    depends_on:
      minio: { condition: service_healthy }

  # on all interfaces: the Inspector test reaches it from a container via host-gateway
  gateway:
    ports: !override ["29000:80"]

  # company SSO e2e drives its login page from the host (28090) while backend talks to mock-idp:8080
  mock-idp:
    profiles: !reset []
    ports: !override ["127.0.0.1:28090:8080"]

networks:
  mcp-cluster:
    name: mcp-cluster-e2e
  aws-local:
    name: mcp-cluster-e2e-aws
    external: false
