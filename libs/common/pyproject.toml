[project]
name = "mcpcluster-common"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastmcp>=2.10",
  "redis[hiredis]>=5.0",
  "orjson>=3.10",
  "cryptography>=43",
  "pydantic>=2.8",
  "polars>=1.0",
  "pyarrow>=17",
  "xlsxwriter>=3.2",
  "aioboto3>=13.1",
  "vl-convert-python>=1.9",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "typst>=0.13",
  "prometheus-client>=0.20",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29", "sqlglot>=25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcpcluster_common"]
