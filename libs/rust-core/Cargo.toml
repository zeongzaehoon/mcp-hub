[package]
name = "mcpcluster_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "mcpcluster_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
rayon = "1.10"
regex = "1.10"
once_cell = "1.19"
sha2 = "0.10"
hex = "0.4"
# Arrow C Data Interface: zero-copy hand-off of pyarrow arrays (PyCapsule protocol)
pyo3-arrow = "0.5"
arrow-array = "53"
arrow-schema = "53"
